name: OTA Update

# Publishes a JS-only update (EAS Update) to the production channel on every
# push to main. Binaries built with expo-updates (the apk.yml builds, once
# expo-updates is baked in) check this channel on launch and pull the latest JS
# without a new store/APK release. Native changes still require a new build.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: EAS Update (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      - name: Build shared package
        run: pnpm --filter @ordo/shared build

      # Prebuild so the fingerprint matches the APK build (which also runs
      # prebuild). Without this, bareNativeDir (android/) differs and the
      # OTA update gets a different runtime version than the installed binary.
      - name: Expo prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # Install eas-cli via npm to avoid pnpm's unapproved-build-script gate
      # (eas-cli pulls dtrace-provider, whose build script pnpm would reject).
      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Publish update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --channel production --non-interactive --auto
